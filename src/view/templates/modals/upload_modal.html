<!-- Upload Modal (for rubrics and documents) -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="uploadModalTitle">Upload File</h2>
            <button type="button" class="close" aria-label="Close" onclick="hideUploadModal()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fileInput">Select File:</label>
                <input type="file" id="fileInput" name="file" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideUploadModal()">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Upload
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Upload Processing Overlay -->
<div id="uploadProcessingOverlay" class="upload-processing-overlay">
    <div class="upload-processing-content">
        <div class="loading-spinner"></div>
        <h3>Processing Rubric</h3>
        <p>Uploading and extracting grading criteria...</p>
    </div>
</div>
